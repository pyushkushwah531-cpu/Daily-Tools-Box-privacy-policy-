:root {

  --surface: #ffffff;
  --surface-2: #f5f5f0;
  --text: #121212;
  --text-2: #5a5a5a;
  --text-3: #8a8a8a;
  --border: #e8e5de;
  --border-strong: #d6d2c8;
  --accent: #121212;
  --accent-soft: #f0ede6;
  --green: #1a7a4c;
  --green-bg: #e6f4eb;
  --radius: 16px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f0f0e;
    --surface: #1a1a18;
    --surface-2: #232320;
    --text: #f5f3ef;
    --text-2: #a8a5a0;
    --text-3: #6b6864;
    --border: #2a2926;
    --border-strong: #3a3834;
    --accent: #f5f3ef;
    --accent-soft: #2a2926;

  -webkit-font-smoothing: antialiased;
}

html {
  scroll-behavior: smooth;
}

  line-height: 1.7;
}

::-moz-selection {
  background: var(--accent);
  color: var(--bg);
}

::selection {
  background: var(--accent);
  color: var(--bg);
}

.hover\:underline:hover{
  text-decoration-line: underline;
}

.hover\:decoration-\[var\(--text\)\]:hover{
  text-decoration-color: var(--text);
}

  .md\:grid-cols-4{

  .md\:p-7{

  }

  .md\:py-16{

    padding-bottom: 4rem;
  }

  .md\:text-\[22px\]{

  }

  .md\:text-\[44px\]{

  }
